name: security-scan

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets-and-json:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Gitleaks (checksum verified)
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$tarball" "$base/$tarball"
          curl -sSfL -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${tarball}\$" checksums.txt | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          rm -f "$tarball" checksums.txt gitleaks

      - name: Scan working tree
        run: gitleaks dir . --config .gitleaks.toml --redact --no-banner --exit-code 1

      - name: Scan full Git history
        run: gitleaks git . --config .gitleaks.toml --redact --no-banner --exit-code 1

      - name: Validate JSON files
        run: |
          set -euo pipefail
          find . -path ./.git -prune -o -name '*.json' -print0 \
            | xargs -0 -n1 python3 -m json.tool > /dev/null

      - name: Validate ADF references, SQL-load pattern and ARM consistency
        run: python3 scripts/validate_adf.py

      - name: Parse T-SQL migrations and tests (sqlfluff, tsql dialect)
        run: |
          set -euo pipefail
          python3 -m pip install --quiet "sqlfluff==4.3.0"
          mkdir -p /tmp/sqllint
          for f in sql/migrations/*.sql sql/tests/*.sql; do
            # strip sqlcmd-only directives/variables, which are not T-SQL
            sed -E -e '/^:(on error|setvar)/d' -e 's/\$\(DataFactoryName\)/adf_identity/g' "$f" > "/tmp/sqllint/$(basename "$f")"
          done
          sqlfluff lint --config .sqlfluff /tmp/sqllint

      - name: Block encryptedCredential and placeholder regressions
        run: |
          set -euo pipefail
          if grep -rIl --exclude-dir=.git '"encryptedCredential"' . ; then
            echo "::error::encryptedCredential found. Use managed identity or Key Vault references." && exit 1
          fi
          if grep -Ev '<[a-z0-9-]+>' deploy/*.example.json | grep -E '"value": "[^"]+"' ; then
            echo "::error::Example parameter files must contain placeholders only." && exit 1
          fi
